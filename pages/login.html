<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acceso a la plataforma CEA Vía.">
  <title>Iniciar sesión | CEA Vía</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar container" aria-label="Navegación principal">
      <a class="navbar-brand brand" href="../index.html">CEA <span>Vía</span></a>
      <a class="nav-link" href="../index.html">Volver al inicio</a>
    </nav>
  </header>
  <main class="container page-container">
    <section class="form-card" aria-labelledby="login-title">
      <p class="eyebrow">Acceso a la plataforma</p>
      <h1 id="login-title">Iniciar sesión</h1>
      <p class="text-secondary">La autenticación se conectará en una etapa posterior.</p>
      <form>
        <div class="mb-3">
          <label class="form-label" for="email">Correo electrónico</label>
          <input class="form-control" type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Contraseña</label>
          <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit" disabled aria-describedby="login-note">Iniciar sesión</button>
        <p class="form-note mt-3 mb-0" id="login-note">El acceso no está conectado a un servicio de autenticación.</p>
      </form>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container"><p class="mb-0">CEA Vía · Proyecto académico en desarrollo</p></div>
  </footer>
</body>
</html>
